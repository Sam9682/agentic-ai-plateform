# OBS pipeline — runtime configuration (Phase 5).
# Consumed by src/obs/signal_bundle.py (WindowConfig) and src/obs/obs_cost.py
# (rate card). Changes take effect on worker restart.

[window]
# Sliding-window duration in seconds. Only observations/events seen within the
# last window_seconds contribute to loop detection (Req 2.1, 2.3, 2.5).
window_seconds = 300

# Loop_Threshold passed to anomaly_engine.analyze as repeat_command_threshold.
# A non-allowlisted operation recurring >= loop_threshold times in-window is
# flagged execution.loop (Req 2.2, 2.5).
loop_threshold = 5

# Comma-separated operation identifiers exempt from loop detection. An
# allowlisted operation is never flagged regardless of repetition (Req 2.4,
# 2.5). Leave blank for an empty allowlist.
allowlist =

[rate_card]
# Cost per usage dimension, applied by obs_cost.compute_cost as
# estimated_cost = sum(value * rate) over present dimensions, stored separately
# from the measured usage (Req 4.6, 4.7). These are illustrative unit rates —
# tune per deployment. Dimensions absent here default to a rate of 0.0.
cpu_seconds = 0.000014
memory_gb_seconds = 0.000004
gpu_seconds = 0.000300
storage_gb_hours = 0.000020
network_gb = 0.090000
llm_tokens = 0.000002
